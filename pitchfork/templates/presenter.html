<body class="view-presenter">
<div id="presenter-grid">
  <div id="pres-current">
    <div class="pres-label">Current</div>
    <div id="pres-current-slide" class="pres-slide-frame"></div>
  </div>
  <div id="pres-next">
    <div class="pres-label">Next</div>
    <div id="pres-next-slide" class="pres-slide-frame"></div>
  </div>
  <div id="pres-meta">
    <div id="pres-counter"></div>
    <div id="pres-chapter"></div>
    <div id="pres-timer">00:00</div>
    <div id="timer-controls">
      <button onclick="startTimer()">Start</button>
      <button onclick="pauseTimer()">Pause</button>
      <button onclick="resetTimer()">Reset</button>
    </div>
  </div>
  <div id="pres-notes">
    <div id="pres-notes-list"></div>
  </div>
</div>

<!-- MARK: Chapter jump overlay -->
<div id="chapter-overlay">
  <div id="chapter-overlay-inner">
    <div id="chapter-overlay-title">Jump to Chapter</div>
    <div id="chapter-list"></div>
    <div id="chapter-overlay-hint">click or press number key &middot; c or esc to close</div>
  </div>
</div>

<script>
const slides = __SLIDES_JSON__;
const chapters = __CHAPTERS_JSON__;
let current = location.hash ? parseInt(location.hash.slice(1)) || 0 : 0;
let timerSeconds = 0, timerInterval = null;

// Reveal step within the current slide. This view always shows the slide fully
// built — it just has to drive and stay in sync with the slides window.
let step = 0;

initSocket();

function buildNotesList() {
  const list = document.getElementById('pres-notes-list');
  list.innerHTML = '';
  slides.forEach((slide, i) => {
    const entry = document.createElement('div');
    entry.className = 'pres-notes-entry dimmed';
    entry.dataset.index = i;
    const label = document.createElement('div');
    label.className = 'pres-notes-entry-label';
    label.textContent = 'Slide ' + (i + 1);
    entry.appendChild(label);
    const body = document.createElement('div');
    body.innerHTML = slide.notes;
    entry.appendChild(body);
    list.appendChild(entry);
  });
  if (window.pfRenderQRs) pfRenderQRs(list);
}

// movedSlide=false means only the step changed - the presenter view always
// shows slides fully built regardless of step, so skip rebuilding slide
// content (which would otherwise reload embedded iframes/videos for nothing).
function render(movedSlide = true) {
  if (movedSlide) {
    const slide = slides[current];
    const next = slides[current + 1];
    document.getElementById('pres-current-slide').innerHTML = slide.html;
    document.getElementById('pres-next-slide').innerHTML = next ? next.html : '<div class="end-marker">End of deck</div>';
    document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
    if (window.pfRenderQRs) pfRenderQRs(document.getElementById('pres-current-slide'));
    if (window.pfRenderQRs) pfRenderQRs(document.getElementById('pres-next-slide'));
  }

  document.getElementById('pres-counter').textContent = (current + 1) + ' / ' + slides.length;

  // Chapter indicator
  const chapterEl = document.getElementById('pres-chapter');
  const title = currentChapterTitle();
  if (title) {
    chapterEl.textContent = '\u00a7 ' + title;
    chapterEl.style.display = '';
  } else {
    chapterEl.style.display = 'none';
  }

  // Update dimming
  document.querySelectorAll('.pres-notes-entry').forEach(entry => {
    const isCurrent = parseInt(entry.dataset.index) === current;
    entry.classList.toggle('dimmed', !isCurrent);
  });

  // Auto-scroll current entry into view
  const activeEntry = document.querySelector('.pres-notes-entry:not(.dimmed)');
  if (activeEntry) {
    activeEntry.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function startTimer() {
  if (timerInterval) return;
  timerInterval = setInterval(() => {
    timerSeconds++;
    const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
    const s = String(timerSeconds % 60).padStart(2, '0');
    document.getElementById('pres-timer').textContent = m + ':' + s;
  }, 1000);
}
function pauseTimer() { clearInterval(timerInterval); timerInterval = null; }
function resetTimer() { pauseTimer(); timerSeconds = 0; document.getElementById('pres-timer').textContent = '00:00'; }

// ── Chapter jump overlay ──────────────────────────────────────
const overlay = document.getElementById('chapter-overlay');

function openChapterOverlay() {
  if (!chapters.length) return;
  const list = document.getElementById('chapter-list');
  list.innerHTML = '';
  chapters.forEach((ch, i) => {
    const item = document.createElement('div');
    item.className = 'chapter-item';
    const num = document.createElement('span');
    num.className = 'chapter-item-num';
    num.textContent = i + 1;
    const ttl = document.createElement('span');
    ttl.className = 'chapter-item-title';
    ttl.textContent = ch.title;
    const slideNum = document.createElement('span');
    slideNum.className = 'chapter-item-slide';
    slideNum.textContent = 'slide ' + (ch.index + 1);
    item.appendChild(num);
    item.appendChild(ttl);
    item.appendChild(slideNum);
    item.addEventListener('click', () => { closeChapterOverlay(); navigate(ch.index); });
    list.appendChild(item);
  });
  overlay.classList.add('open');
}

function closeChapterOverlay() {
  overlay.classList.remove('open');
}

overlay.addEventListener('click', (e) => {
  if (e.target === overlay) closeChapterOverlay();
});

document.addEventListener('keydown', (e) => {
  if (overlay.classList.contains('open')) {
    if (e.key === 'Escape' || e.key === 'c') { closeChapterOverlay(); return; }
    const n = parseInt(e.key);
    if (!isNaN(n) && n >= 1 && n <= chapters.length) {
      closeChapterOverlay();
      navigate(chapters[n - 1].index);
      return;
    }
    return; // swallow other keys while overlay is open
  }
  if (e.key === 'c') { openChapterOverlay(); return; }
  if (e.key === 'ArrowRight' || e.key === 'j' || e.key === ' ') advance();
  if (e.key === 'ArrowLeft'  || e.key === 'k') retreat();
  if (e.key === 't') window.open('/timer', '_blank');
});

buildNotesList();
render();
document.getElementById('pres-chapter').addEventListener('click', openChapterOverlay);
_makeTasklistsInteractive(document.getElementById('pres-notes-list'));
</script>
</body></html>
