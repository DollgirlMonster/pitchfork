<body class="view-notes">
<div id="strip-container">
  <div id="strip"></div>
</div>
<div id="notes-panel">
  <div id="chapter-indicator"></div>
  <div id="step-indicator"></div>
  <div id="notes-list"></div>
</div>

<!-- MARK: Chapter Jump Overlay -->
<div id="chapter-overlay">
  <div id="chapter-overlay-inner">
    <div id="chapter-overlay-title">Jump to Chapter</div>
    <div id="chapter-list"></div>
    <div id="chapter-overlay-hint">click or press number key &middot; c or esc to close</div>
  </div>
</div>

<!-- MARK: Slide Overview -->
<div id="overview-overlay">
  <div id="overview-inner">
    <div id="overview-title">Slide Overview</div>
    <div id="overview-grid"></div>
    <div id="overview-hint">click a slide to jump &middot; g or esc to close</div>
  </div>
</div>

<script>
const slides = __SLIDES_JSON__;
const chapters = __CHAPTERS_JSON__;
let current = location.hash ? parseInt(location.hash.slice(1)) || 0 : 0;
// Reveal step within the current slide, kept in step with the slides view so
// a build can be driven from here.
let step = 0;

initSocket();

function buildStrip() {
  const strip = document.getElementById('strip');
  strip.innerHTML = '';
  slides.forEach((slide, i) => {
    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    thumb.dataset.index = i;
    thumb.innerHTML = '<div class="thumb-inner">' + slide.html + '</div><span class="thumb-num">' + (i + 1) + '</span>';
    thumb.addEventListener('click', () => navigate(i));
    strip.appendChild(thumb);
  });
  if (window.pfRenderQRs) pfRenderQRs(strip);
}

function buildNotesList() {
  const list = document.getElementById('notes-list');
  list.innerHTML = '';
  slides.forEach((slide, i) => {
    const entry = document.createElement('div');
    entry.className = 'notes-entry dimmed';
    entry.dataset.index = i;
    const label = document.createElement('div');
    label.className = 'notes-entry-label';
    label.textContent = 'Slide ' + (i + 1);
    entry.appendChild(label);
    const body = document.createElement('div');
    body.innerHTML = slide.notes;
    entry.appendChild(body);
    list.appendChild(entry);
  });
  if (window.pfRenderQRs) pfRenderQRs(list);
}

function render() {
  document.querySelectorAll('.thumb').forEach(t => {
    t.classList.toggle('active', parseInt(t.dataset.index) === current);
  });
  document.querySelectorAll('.notes-entry').forEach(e => {
    e.classList.toggle('dimmed', parseInt(e.dataset.index) !== current);
  });

  const activeThumb = document.querySelector('.thumb.active');
  if (activeThumb) activeThumb.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });

  const activeEntry = document.querySelector('.notes-entry:not(.dimmed)');
  if (activeEntry) activeEntry.scrollIntoView({ behavior: 'smooth', block: 'start' });

  // MARK: Chapter indicator
  const indicator = document.getElementById('chapter-indicator');
  const title = currentChapterTitle();
  if (title) {
    indicator.textContent = '\u00a7 ' + title;
    indicator.style.display = '';
  } else {
    indicator.style.display = 'none';
  }

  // MARK: Step indicator
  // Only shown on slides that actually build, so it stays out of the way.
  const stepIndicator = document.getElementById('step-indicator');
  const total = maxStep(current);
  if (total > 0) {
    stepIndicator.textContent = 'step ' + step + '/' + total;
    stepIndicator.classList.toggle('complete', step === total);
    stepIndicator.style.display = '';
  } else {
    stepIndicator.style.display = 'none';
  }
}

function openChapterOverlay() {
  if (!chapters.length) return;
  const list = document.getElementById('chapter-list');
  list.innerHTML = '';
  chapters.forEach((ch, i) => {
    const item = document.createElement('div');
    item.className = 'chapter-item';
    const num = document.createElement('span');
    num.className = 'chapter-item-num';
    num.textContent = i + 1;
    const ttl = document.createElement('span');
    ttl.className = 'chapter-item-title';
    ttl.textContent = ch.title;
    const slideNum = document.createElement('span');
    slideNum.className = 'chapter-item-slide';
    slideNum.textContent = 'slide ' + (ch.index + 1);
    item.appendChild(num);
    item.appendChild(ttl);
    item.appendChild(slideNum);
    item.addEventListener('click', () => { closeChapterOverlay(); navigate(ch.index); });
    list.appendChild(item);
  });
  overlay.classList.add('open');
}

function closeChapterOverlay() {
  overlay.classList.remove('open');
}

const overlay = document.getElementById('chapter-overlay');

overlay.addEventListener('click', (e) => {
  if (e.target === overlay) closeChapterOverlay();
});

// MARK: Slide Overview
// Built fresh each time it opens: it renders every slide, which is wasted work
// on a long deck if you never press g.
const overviewOverlay = document.getElementById('overview-overlay');

function openOverview() {
  const grid = document.getElementById('overview-grid');
  grid.innerHTML = '';

  slides.forEach((slide, i) => {
    const chapter = chapters.find(ch => ch.index === i);
    if (chapter) {
      const heading = document.createElement('div');
      heading.className = 'overview-chapter';
      heading.textContent = '§ ' + chapter.title;
      grid.appendChild(heading);
    }

    const cell = document.createElement('div');
    cell.className = 'overview-cell' + (i === current ? ' active' : '');
    cell.innerHTML =
      '<div class="overview-thumb"><div class="overview-thumb-inner">' + slide.html +
      '</div></div><span class="overview-num">' + (i + 1) + '</span>';
    cell.addEventListener('click', () => { closeOverview(); navigate(i); });
    grid.appendChild(cell);
  });

  if (window.pfRenderQRs) pfRenderQRs(grid);
  overviewOverlay.classList.add('open');

  const active = grid.querySelector('.overview-cell.active');
  if (active) active.scrollIntoView({ block: 'center' });
}

function closeOverview() {
  overviewOverlay.classList.remove('open');
  document.getElementById('overview-grid').innerHTML = '';
}

overviewOverlay.addEventListener('click', (e) => {
  if (e.target === overviewOverlay) closeOverview();
});

document.addEventListener('keydown', (e) => {
  if (overviewOverlay.classList.contains('open')) {
    if (e.key === 'Escape' || e.key === 'g') closeOverview();
    return; // swallow other keys while the overview is open
  }
  if (overlay.classList.contains('open')) {
    if (e.key === 'Escape' || e.key === 'c') { closeChapterOverlay(); return; }
    const n = parseInt(e.key);
    if (!isNaN(n) && n >= 1 && n <= chapters.length) {
      closeChapterOverlay();
      navigate(chapters[n - 1].index);
      return;
    }
    return; // swallow other keys while overlay is open
  }
  if (e.key === 'c') { openChapterOverlay(); return; }
  if (e.key === 'g') { openOverview(); return; }
  if (e.key === 't') {
    // Named so pressing t again (here or in the slides view) focuses the
    // timer you already have open instead of spawning another.
    const win = window.open('/timer', 'Timer', 'width=300,height=240');
    if (win) win.focus();
    return;
  }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'j' || e.key === ' ') advance();
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp'   || e.key === 'k') retreat();
});

buildStrip();
buildNotesList();
render();
document.getElementById('chapter-indicator').addEventListener('click', openChapterOverlay);
_makeTasklistsInteractive(document.getElementById('notes-list'));

// MARK: Soundboard
const _soundboard = __SOUNDBOARD_JSON__;
const _soundboardAudio = {};
(function() {
  for (const slot in _soundboard) {
    const audio = new Audio(_soundboard[slot]);
    audio.preload = 'auto';
    _soundboardAudio[slot] = audio;
  }
})();

document.addEventListener('keydown', (e) => {
  if (overlay.classList.contains('open')) return;
  // Numpad1–Numpad9 or digit keys 1–9 trigger soundboard slots
  let slot = null;
  if (e.code && e.code.startsWith('Numpad') && e.code.length === 7) {
    const n = e.code.slice(6);
    if (n >= '1' && n <= '9') slot = n;
  } else if (!e.altKey && !e.ctrlKey && !e.metaKey && e.key >= '1' && e.key <= '9') {
    slot = e.key;
  }
  // 0 / Numpad0 stops all playback
  const isZero = e.key === '0' || e.code === 'Numpad0';
  if (isZero && Object.keys(_soundboardAudio).length) {
    e.preventDefault();
    for (const a of Object.values(_soundboardAudio)) { a.pause(); a.currentTime = 0; }
    return;
  }
  if (slot && _soundboardAudio[slot]) {
    e.preventDefault();
    const audio = _soundboardAudio[slot];
    audio.currentTime = 0;
    audio.play().catch((err) => { console.error('[soundboard] slot ' + slot + ':', err); });
  }
});
</script>
</body></html>
