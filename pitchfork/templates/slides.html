<body class="view-slides">
<div id="slide-viewport">
<div id="slide-container">
  <div id="slide-content"></div>
  <canvas id="draw-canvas"></canvas>
  <div id="slide-logo"><img src="/logo.png" alt="" onerror="this.parentElement.style.display='none'"></div>
</div>
<!-- Outside #slide-container on purpose: spans the real window edge-to-edge 
rather than being confined to the fixed-size stage like the canvas/logo are -->
<div id="slide-chapter-strip">
  <span id="slide-counter-inline"></span>
  <span id="slide-chapter-current"></span>
  <span id="slide-chapter-upcoming"></span>
</div>
</div>

<script>
const slides = __SLIDES_JSON__;
const chapters = __CHAPTERS_JSON__;
let current = location.hash ? parseInt(location.hash.slice(1)) || 0 : 0;
// Reveal step within the current slide. 0 through slides[i].steps
// 0 = everything before the first `--`
// `slides[i].steps` = everything revealed.
let step = 0;

// MARK: Stage
// #slide-container is laid out at the fixed logical size STAGE_W x STAGE_H
// and scaled uniformly here to fit whatever window it's actually shown in. 
// This keeps slide layout and draw-canvas coordinates identical across devices
const stageEl = document.getElementById('slide-container');
stageEl.style.setProperty('--pf-stage-w', STAGE_W + 'px');
stageEl.style.setProperty('--pf-stage-h', STAGE_H + 'px');

function applyStageScale() {
  const scale = Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H);
  stageEl.style.transform = `scale(${scale})`;
}

applyStageScale();
window.addEventListener('resize', applyStageScale);

initSocket();

// Tag every element that follows a step sentinel with the step it belongs to.
// Walking siblings rather than restructuring the DOM keeps builds working
// inside ::zones::, so a `--` in ::left:: only affects that column.
function assignSteps(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_COMMENT);
  const marks = [];
  let node;
  while ((node = walker.nextNode())) {
    if (node.nodeValue.trim() === 'pf-step') marks.push(node);
  }
  marks.forEach((mark, i) => {
    let sibling = mark.nextSibling;
    while (sibling) {
      if (sibling.nodeType === 1) sibling.dataset.pfStep = String(i + 1);
      sibling = sibling.nextSibling;
    }
  });
}

function applyStep() {
  document.querySelectorAll('#slide-content [data-pf-step]').forEach(el => {
    el.classList.toggle('pf-step-hidden', Number(el.dataset.pfStep) > step);
  });
}

function renderChapterStrip() {
  const chIdx = currentChapterIndex();

  document.getElementById('slide-counter-inline').textContent =
    (current + 1) + '/' + slides.length;

  const upcomingEl = document.getElementById('slide-chapter-upcoming');
  upcomingEl.innerHTML = '';

  if (chapters.length === 0) {
    document.getElementById('slide-chapter-current').textContent = '';
    return;
  }

  const chCurrent = chIdx >= 0 ? chapters[chIdx] : null;
  document.getElementById('slide-chapter-current').textContent =
    chCurrent ? '§ ' + chCurrent.title : '';

  const upcoming = chapters.slice(chIdx + 1);
  const minOpacity = 0.18;
  upcoming.forEach((ch, i) => {
    const span = document.createElement('span');
    span.className = 'slide-chapter-upcoming-item';
    span.textContent = ch.title;
    span.style.opacity = i === 0 ? minOpacity * 1.6 : minOpacity;
    upcomingEl.appendChild(span);
  });
}

// movedSlide=false means only the step changed (a `--` reveal) - skip the
// full rebuild so embedded iframes/videos and the draw canvas aren't reset.
function render(movedSlide = true) {
  if (!movedSlide) { applyStep(); return; }
  // Not broadcast: whichever side triggered this navigation already sent a navigate message,
  // so other instances will receive the same message and clear automatically
  strokes = [];
  clearCanvas();
  const slide = slides[current];
  const container = document.getElementById('slide-content');
  container.innerHTML = slide.html;
  document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
  if (window.pfRenderQRs) pfRenderQRs(container);
  assignSteps(container);
  applyStep();
  renderChapterStrip();
}

// ── Drawing ──────────────────────────────────────────────────
const canvas = document.getElementById('draw-canvas');
const ctx = canvas.getContext('2d');
let drawing = false;
let hasMoved = false;

const cs = getComputedStyle(document.documentElement);
function drawColor() { return cs.getPropertyValue('--pf-draw-color').trim() || '#ff3b30'; }
function drawWidth() { return parseFloat(cs.getPropertyValue('--pf-draw-width')) || 4; }

// The canvas buffer is fixed to the stage's logical resolution, not the real window
function initCanvas() {
  canvas.width = STAGE_W;
  canvas.height = STAGE_H;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
}

// When interactive elements (iframes, videos, links, form controls) are hovered
// or touched, disable pointer events on the drawing canvas so their controls
// are clickable. Re-binds after slide content changes.
function bindInteractiveGuard() {
  const SELECTOR = 'iframe, video, audio, a, button, input, select, textarea';

  // Check what's underneath the drawing canvas at a given point by
  // temporarily disabling pointer-events on the canvas, querying
  // elementFromPoint, then restoring pointer-events.
  function elementUnderPoint(x, y) {
    const prev = canvas.style.pointerEvents;
    canvas.style.pointerEvents = 'none';
    const el = document.elementFromPoint(x, y);
    canvas.style.pointerEvents = prev;
    return el;
  }

  function updateAtPoint(x, y, pointerType) {
    // Only care about clicking links for the mouse
    if (pointerType !== 'mouse') { canvas.style.pointerEvents = ''; return; }
    
    if (drawing) return;
    const el = elementUnderPoint(x, y);
    const hit = el && el.closest && el.closest(SELECTOR);
    if (hit) {
      canvas.style.pointerEvents = 'none';
    } else {
      canvas.style.pointerEvents = '';
    }
  }

  // Pointer movement (mouse/touch/pen) drives the check
  document.addEventListener('pointermove', (e) => {
    updateAtPoint(e.clientX, e.clientY, e.pointerType);
  }, { passive: true });

  document.addEventListener('touchstart', (e) => {
    const t = e.touches && e.touches[0];
    if (t) updateAtPoint(t.clientX, t.clientY);
  }, { passive: true });

  // Also check on click/press to ensure canvas stays disabled while
  // interacting with the control until pointer moves away.
  document.addEventListener('pointerdown', (e) => {
    updateAtPoint(e.clientX, e.clientY, e.pointerType);
  }, true);

  // Re-bind on DOM changes (new iframes / interactive elements may appear)
  const container = document.getElementById('slide-content');
  if (!container) return;
  const obs = new MutationObserver(() => { /* no-op: pointer handlers check underlying elements */ });
  obs.observe(container, { childList: true, subtree: true });
}

function clearCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * canvas.width / rect.width,
    y: (e.clientY - rect.top) * canvas.height / rect.height,
  };
}

// ── Retained stroke model ───────────────────────────────────
// A plain array of {points, color, width}, kept alongside the raster canvas to support undo
let strokes = [];
let currentStroke = null;

function strokeToCanvas(stroke) {
  if (stroke.points.length === 1) {
    const p = stroke.points[0];
    ctx.beginPath();
    ctx.arc(p.x, p.y, stroke.width / 2, 0, Math.PI * 2);
    ctx.fillStyle = stroke.color;
    ctx.fill();
    return;
  }
  ctx.beginPath();
  ctx.strokeStyle = stroke.color;
  ctx.lineWidth = stroke.width;
  ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
  for (let i = 1; i < stroke.points.length; i++) ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
  ctx.stroke();
}

function redrawAll() {
  clearCanvas();
  strokes.forEach(strokeToCanvas);
}

function broadcastStroke(stroke) {
  ws.send(JSON.stringify({ type: 'draw-stroke', stroke }));
}

// Called when a stroke arrives from another device:
// pushes it into the local history and paints just that stroke
// This also implicitly "finalizes" whatever the live-preview
// below painted for this same stroke, patching over any gaps
function applyRemoteStroke(stroke) {
  strokes.push(stroke);
  strokeToCanvas(stroke);
  remoteLiveId = null;
}

// ── Live stroke preview (remote) ────────────────────────────
// Points a device is *currently* drawing, streamed as they happen so a
// viewer sees the stroke appear in real time rather than only once it's
// finished. 
// Purely visual/transient and never touches `strokes` array: the
// eventual draw-stroke message above is what actually commits it, so any
// points this drops are invisible once that arrives.
let remoteLiveId = null;

function applyRemoteDrawPoint(msg) {
  if (!msg.points.length) return;
  let pts = msg.points;
  if (msg.id !== remoteLiveId) {
    remoteLiveId = msg.id;
    ctx.beginPath();
    ctx.strokeStyle = msg.color;
    ctx.lineWidth = msg.width;
    ctx.moveTo(pts[0].x, pts[0].y);
    pts = pts.slice(1);
  }
  pts.forEach(p => ctx.lineTo(p.x, p.y));
  if (pts.length) ctx.stroke();
}

function undo() {
  if (!strokes.length) return;
  strokes.pop();
  redrawAll();
  ws.send(JSON.stringify({ type: 'undo' }));
}

function applyRemoteUndo() {
  strokes.pop();
  redrawAll();
}

// Explicit clear (Backspace)
function manualClear() {
  strokes = [];
  clearCanvas();
  ws.send(JSON.stringify({ type: 'clear' }));
}

function applyRemoteClear() {
  strokes = [];
  clearCanvas();
}

// ── Live stroke preview (local → remote) ────────────────────
// Points collected since the last flush, sent at most once per animation
// frame rather than once per pointermove
// Purely a live preview; broadcastStroke() below (on pointerup)
// is what actually commits the stroke, so anything lost or dropped here is fine
let liveStrokeSeq = 0;
let pendingPoints = [];
let flushScheduled = false;

function flushLivePoints() {
  flushScheduled = false;
  if (!pendingPoints.length || !currentStroke) return;
  ws.send(JSON.stringify({
    type: 'draw-point',
    id: currentStroke.id,
    color: currentStroke.color,
    width: currentStroke.width,
    points: pendingPoints,
  }));
  pendingPoints = [];
}

// Ugh. ok. (bugs.webkit.org #217430)
// iPadOS Scribble (handwriting recognition, on by default) operates above
// the browser: when it recognizes a stroke as handwriting-shaped, it can
// swallow the underlying pointer events before they ever reach the page.
// The verified workaround is an explicit touchmove listener that calls preventDefault()
// touch-action:none in CSS alone isn't enough
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });

// Pointer Events (not mouse events)
canvas.addEventListener('pointerdown', (e) => {
  // Palm rejection
  if (e.pointerType === 'touch') { e.preventDefault(); return; }
  // Self-healing: a stroke is still marked "open" (shouldn't normally
  // happen, see the note above `drawing`'s declaration), so close it out now
  if (drawing) finishStroke();
  drawing = true;
  hasMoved = false;
  const p = getPos(e);
  currentStroke = { id: ++liveStrokeSeq, points: [p], color: drawColor(), width: drawWidth() };
  pendingPoints = [];
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.strokeStyle = currentStroke.color;
  ctx.lineWidth = currentStroke.width;

  // keep a stroke tracked correctly if the pointer strays outside the canvas mid-drag
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});

canvas.addEventListener('pointermove', (e) => {
  if (!drawing) return;
  hasMoved = true;
  const p = getPos(e);
  currentStroke.points.push(p);
  pendingPoints.push(p);
  if (!flushScheduled) { flushScheduled = true; requestAnimationFrame(flushLivePoints); }
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
});


function finishStroke() {
  if (!drawing) return;
  drawing = false;
  flushLivePoints(); // don't wait for the next animation frame — the stroke is over now
  if (!currentStroke) return; // shouldn't happen
  if (!hasMoved) strokeToCanvas(currentStroke); // single-point stroke draws as a dot
  strokes.push(currentStroke);
  broadcastStroke(currentStroke);
  currentStroke = null;
}

canvas.addEventListener('pointerup', finishStroke);
canvas.addEventListener('pointercancel', finishStroke);
// Don't listen for pointerleave! with setPointerCapture in
// use, pointermove/pointerup/pointercancel already keep targeting the
// canvas regardless of where the pointer physically is, but boundary events
// like pointerleave still reflect the real hit-test

initCanvas();

bindInteractiveGuard();

// Track all spawned popup windows so they can be closed when this view does
const _spawnedWindows = [];

function _openPopup(url, name, features) {
  const win = window.open(url, name, features);
  if (win) _spawnedWindows.push(win);
  return win;
}

window.addEventListener('beforeunload', () => {
  if (_reloading) return;
  _spawnedWindows.forEach(w => { try { if (w && !w.closed) w.close(); } catch (e) {} });
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Backspace')  { manualClear(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); advance(); }
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp'   || e.key === 'k') retreat();
  if (e.key === 'n') _openPopup('/notes', 'Notes View', 'location,status,scrollbars,resizable,width=680,height=1080');
  if (e.key === 't') _openPopup('/timer', 'Timer', 'width=300,height=240');
});

render();
</script>
</body></html>
